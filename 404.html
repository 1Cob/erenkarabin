<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sayfa bulunamadı | Eren Karabin — Fizik Özel Ders</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 32px;
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 90% at 20% 0%, #12294a 0%, #08152b 60%);
    color: #b9c9e6; text-align: center;
  }
  .wrap { max-width: 560px; }
  .code {
    font: 800 clamp(4rem, 16vw, 8rem)/1 "Sora", sans-serif;
    background: linear-gradient(100deg, #60a5fa 10%, #f59e0b 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 8px;
  }
  h1 { font: 800 clamp(1.4rem, 4vw, 2rem)/1.2 "Sora", sans-serif; color: #fff; margin: 0 0 16px; }
  p { font-size: 17px; line-height: 1.7; margin: 0 0 32px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 15px 28px; border-radius: 999px;
    font: 600 16px/1 inherit; text-decoration: none; white-space: nowrap;
    transition: transform .18s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; box-shadow: 0 10px 24px rgba(37,99,235,.32); }
  .ghost { background: rgba(255,255,255,.08); color: #e8eefc; border: 1px solid rgba(255,255,255,.28); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>Bu sayfa yörüngeden çıkmış</h1>
    <p>
      Aradığınız sayfa bulunamadı — adres değişmiş ya da yanlış yazılmış olabilir.
      Ana sayfadan devam edebilir ya da doğrudan bana ulaşabilirsiniz.
    </p>
    <div class="actions">
      <a class="btn primary" href="/">Ana sayfaya dön</a>
      <a class="btn ghost" href="tel:+905546459201">📞 0554&nbsp;645&nbsp;92&nbsp;01</a>
    </div>
  </div>
</body>
</html>
